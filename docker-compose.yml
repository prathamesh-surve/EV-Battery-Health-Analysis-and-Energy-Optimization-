version: '3.8'
services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      # Fixes the 403 Forbidden log viewing issue
      - AIRFLOW__WEBSERVER__SECRET_KEY=super_secret_key_for_local_development_only
      # FIXED: Removed tensorflow to protect system container memory allocations
      - _PIP_ADDITIONAL_REQUIREMENTS=numpy<2.0.0 pandas==2.2.2 scikit-learn
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
    ports:
      - "8080:8080"
    command: webserver
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 6GB
        reservations:
          memory: 2GB

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      - LOAD_EXAMPLES=False
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      # Fixes the 403 Forbidden log viewing issue
      - AIRFLOW__WEBSERVER__SECRET_KEY=super_secret_key_for_local_development_only
      # FIXED: Must match webserver requirements exactly and exclude tensorflow
      - _PIP_ADDITIONAL_REQUIREMENTS=numpy<2.0.0 pandas==2.2.2 scikit-learn
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
    command: scheduler
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 6GB
        reservations:
          memory: 2GB

volumes:
  postgres_data: